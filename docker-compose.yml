version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: concord-postgres
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_dev_password
      POSTGRES_DB: concord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concord-network

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concord-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concord-backend
    environment:
      DATABASE_URL: postgresql://concord:concord_dev_password@postgres:5432/concord
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - concord-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concord-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - concord-network

volumes:
  postgres_data:
  redis_data:

networks:
  concord-network:
    driver: bridge
